# Levanta la app con Docker: frontend (nginx) + backend (Node/Express)
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: service-center-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      # Host/IP donde corre print_bridge.py (PC Windows con la impresora USB).
      # En Docker Desktop: host.docker.internal. En Docker Engine en WSL2, usá
      # la IP de Windows (ej. 192.168.0.90) o agregá --add-host al contenedor.
      - PRINT_BRIDGE_HOST=${PRINT_BRIDGE_HOST:-host.docker.internal}
      - PRINT_BRIDGE_PORT=9200
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET antes de levantar el sistema}
    volumes:
      - service-center_data:/app/data
    # Permite que el backend (en el contenedor) alcance la PC Windows que
    # corre print_bridge.py, incluso con Docker Engine en WSL2.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: service-center-frontend
    restart: unless-stopped
    ports:
      # Cambiá el puerto de la izquierda si 8080 está ocupado.
      - "8081:80"
    depends_on:
      - backend

volumes:
  # Los datos de la base central se guardan acá y sobreviven reinicios.
  service-center_data: